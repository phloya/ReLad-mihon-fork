# Re:Lad version (own numbering, independent of Mihon's).
# Bump versionName before tagging a release; the tag must be relad-v<versionName>, e.g. relad-v0.1.0
# (plain vX.Y.Z tags are already used by Tachiyomi/Mihon history).
# versionCode is derived from it: major * 10000 + minor * 100 + patch (minor and patch < 100).
versionName=0.1.0
